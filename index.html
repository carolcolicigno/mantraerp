<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mantra ERP · Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- Icon rail -->
    <nav class="rail" aria-label="Main">
      <svg class="rail__logo" width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" aria-label="Mantra">
        <circle cx="10" cy="10" r="6"/><circle cx="18" cy="10" r="6"/><circle cx="10" cy="18" r="6"/><circle cx="18" cy="18" r="6"/>
      </svg>
      <button class="rail__btn" title="Dashboard"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></button>
      <button class="rail__btn is-active" title="Projects"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
      <button class="rail__btn" title="Calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></button>
      <button class="rail__btn" title="Reports"><svg viewBox="0 0 24 24"><path d="M6 20v-6M12 20V6M18 20v-9"/></svg></button>
      <button class="rail__btn" title="Messages"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
      <button class="rail__btn" title="Team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg></button>
      <button class="rail__btn" title="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg></button>
      <button class="rail__btn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </nav>

    <!-- Project list -->
    <aside class="projects">
      <h1 class="projects__title">All Projects</h1>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="Search Project" />
      </label>
      <div class="status-tabs" role="tablist" id="statusTabs"></div>
      <ul class="project-list" id="projectList"></ul>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="main__header">
        <div>
          <h2 class="main__title"><span id="projectName"></span> <span class="bolt">⚡</span></h2>
          <p class="crumbs" id="crumbs"></p>
        </div>
        <div class="main__actions">
          <button class="icon-btn" id="starBtn" aria-pressed="false" title="Favorite"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></button>
          <button class="icon-btn" title="More"><svg viewBox="0 0 24 24" class="fill"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
        </div>
      </header>

      <div class="subnav">
        <div class="tabs" role="tablist" id="pageTabs">
          <button>Discussion</button><button class="is-active">Tasks</button><button>Timelines</button><button>Files</button><button>Overview</button>
        </div>
        <div class="members">
          <div class="avatars"><span class="av av--1"></span><span class="av av--2"></span><span class="av av--3"></span><span class="av av--more">+11</span></div>
          <button class="add-member" title="Add member">+</button>
        </div>
      </div>

      <section class="board-wrap">
        <div class="toolbar">
          <div class="views" id="views">
            <button class="is-active" data-view="kanban"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="16" rx="1"/><rect x="14" y="4" width="6" height="16" rx="1"/></svg>Kanban</button>
            <button data-view="table"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 10h16M4 15h16M10 4v16"/></svg>Table</button>
            <button data-view="list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg>List View</button>
          </div>
          <div class="toolbar__right">
            <button class="btn-primary" id="newBoard">+ New Board</button>
            <button class="btn-ghost"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Filter</button>
          </div>
        </div>
        <div id="board"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
